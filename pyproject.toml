[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "petri-modeling-skills"
version = "0.2.0"
description = "Shared skills for modeling, explaining and validating Petri nets"
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
dependencies = []

[project.optional-dependencies]
test = ["jsonschema>=4.18"]

[tool.hatch.build.targets.wheel]
packages = ["petri_modeling_skills"]

[tool.hatch.build.targets.sdist]
include = ["petri_modeling_skills", "tests", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]
