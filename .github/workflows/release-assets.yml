name: Build release assets

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - run: uv pip install --system '.[test]'
      - run: python -m unittest discover -s tests -v
      - name: Build normalized wheel and resource archive
        run: python scripts/build_release_assets.py
      - name: Verify reviewed artifact checksums
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('release-checksums.json').read_text())
          actual = json.loads(Path('dist/release-assets.json').read_text())
          assert actual == expected, 'Release files differ from the reviewed checksums'
          PY
      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path('dist/release-assets.json').read_text())['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Release tag and package version differ'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: shared-skills-release-assets
          path: dist/*
      - name: Attach assets to the existing published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*
